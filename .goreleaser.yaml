version: 2
project_name: ikctl

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: ikctl
    main: ./cmd/ikctl
    binary: ikctl
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/rustyrien/ikctl/internal/version.Version={{ .Version }}
      - -X github.com/rustyrien/ikctl/internal/version.Commit={{ .FullCommit }}
      - -X github.com/rustyrien/ikctl/internal/version.Date={{ .Date }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, skills/**/*]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
